schema_version: 3
id: containerd
name: containerd
category: tool
kind: tool
domains:
- cloud
- containers
- systems
- devops
summary: Container lifecycle daemon and API that manages content, images, snapshots, containers, tasks, runtimes, and plugins beneath higher-level platforms such as Docker and Kubernetes.
homepage: https://containerd.io/
repository: https://github.com/containerd/containerd
license: Apache-2.0
deployment_types:
- service
- system
- self-hosted
status: active
verified_at: '2026-09-05'
tags:
- containers
- runtime
- oci
- cri
- snapshotters
- systems
coverage:
  area: cloud-devops-sre
  topics:
  - containers
  - deployment
relationships:
- type: related-to
  target: concept/containers
  note: containerd manages image, filesystem, process, and lifecycle objects that realize container workflows on a host.
- type: used-by
  target: tool/docker
  note: Docker Engine uses containerd for container lifecycle services and can use containerd-backed image storage.
- type: integrates-with
  target: cloud/kubernetes
  note: containerd includes CRI support so Kubernetes kubelet can delegate image and runtime operations to containerd on a node.
