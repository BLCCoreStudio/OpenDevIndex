schema_version: 3
id: postgresql
name: PostgreSQL
category: database
kind: database
domains:
- data
summary: Open-source relational database whose server combines SQL, MVCC transactions, WAL durability, cost-based query planning, extensible types and indexes, replication, and rich operational tooling for transactional and analytical workloads.
homepage: https://www.postgresql.org/
repository: https://github.com/postgres/postgres
license: PostgreSQL
deployment_types:
- self-hosted
- service
status: active
verified_at: '2026-09-06'
tags:
- sql
- relational
- database
- mvcc
- transactions
- wal
- replication
- indexing
- query-planner
- extensibility
- deep-dive
coverage:
  area: databases-data
  topics:
  - relational-databases
  - storage-engines
  - query-engines
relationships:
- type: alternative-to
  target: database/mysql
  note: PostgreSQL and MySQL are widely used client-server relational databases with different SQL behavior, extensibility, storage, replication, operational tooling, and ecosystem trade-offs.
- type: alternative-to
  target: database/sqlite
  note: PostgreSQL is a multi-process client-server database built for concurrent networked workloads; SQLite is an embedded database library with a very different deployment and concurrency model.
