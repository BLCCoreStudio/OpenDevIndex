schema_version: 3
id: grafana
name: Grafana
category: cloud
kind: platform
domains:
- observability
- devops
summary: Open-source observability visualization and alerting platform that connects to external data sources, executes their query languages, transforms results, renders dashboards and Explore views, and manages alert evaluation and notification workflows.
homepage: https://grafana.com/grafana/
repository: https://github.com/grafana/grafana
license: AGPL-3.0-only
deployment_types:
- self-hosted
status: active
verified_at: '2026-09-06'
tags:
- observability
- dashboards
- visualization
- monitoring
- alerting
- data-sources
- deep-dive
coverage:
