schema_version: 3
id: ansible
name: Ansible
category: cloud
kind: tool
domains:
- cloud
- devops
summary: Agentless automation system whose control node resolves inventory, variables, playbooks, plugins, and collections into ordered tasks executed across managed nodes for configuration management, deployment, orchestration, and repeatable operations.
homepage: https://docs.ansible.com/
repository: https://github.com/ansible/ansible
license: GPL-3.0-or-later
deployment_types:
- cli
- local
status: active
verified_at: '2026-09-06'
tags:
- automation
- configuration-management
- orchestration
- deployment
- inventory
- playbooks
- collections
- agentless
- devops
- deep-dive
coverage:
  area: cloud-devops-sre
  topics:
  - configuration-management
  - deployment
  - platform-engineering
relationships:
- type: related-to
  target: cloud/terraform
  note: Terraform centers on stateful resource lifecycle; Ansible commonly handles host and service configuration plus procedural orchestration. Teams often combine them with explicit ownership boundaries.
- type: integrates-with
  target: cloud/kubernetes
  note: Ansible collections can automate Kubernetes resources and cluster-adjacent operations, while continuous reconciliation is normally owned by Kubernetes controllers or GitOps systems.
