relationships:
- type: related-to
  target: tool/git-lfs
  note: Git LFS extends Git workflows for repositories that need to manage large binary assets outside normal object history.
- type: integrates-with
  target: tool/gh
  note: GitHub CLI adds forge-specific pull request, issue, release, and repository workflows around Git repositories.
- type: integrates-with
  target: tool/github-actions
  note: GitHub Actions commonly uses Git commits, branches, and tags as automation and CI/CD triggers.
