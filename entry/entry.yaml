schema_version: 3
id: mysql
name: MySQL
category: database
kind: database
domains:
- data
summary: Open-source client/server relational database whose SQL layer, InnoDB transactional storage engine, binary log, replication, and operational tooling support transactional and mixed application workloads.
homepage: https://www.mysql.com/
repository: https://github.com/mysql/mysql-server
license: GPL-2.0 (Community Edition)
deployment_types:
- self-hosted
- service
status: active
verified_at: '2026-09-06'
tags:
- sql
- relational
- database
- innodb
- transactions
- mvcc
- indexing
- replication
- binary-log
- query-optimizer
- high-availability
- deep-dive
coverage:
  area: databases-data
  topics:
  - relational-databases
  - storage-engines
  - query-engines
relationships:
- type: alternative-to
  target: database/postgresql
  note: MySQL and PostgreSQL are mature client/server relational databases with different storage architectures, SQL behavior, optimizer internals, extensibility, replication models, and operational ecosystems.
- type: alternative-to
  target: database/sqlite
  note: MySQL is a networked multi-client database server with server-managed accounts, replication, and HA tooling; SQLite is an embedded database library with a single-file deployment model and different concurrency boundaries.
