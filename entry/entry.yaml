schema_version: 3
id: opentofu
name: OpenTofu
category: tool
kind: tool
domains:
- cloud
- developer-tools
- devops
summary: Community-governed open-source infrastructure-as-code engine for declarative provisioning through provider plugins, dependency-aware plans, persistent state, and Terraform-compatible workflows, with independent governance and native state/plan encryption.
homepage: https://opentofu.org/
repository: https://github.com/opentofu/opentofu
license: MPL-2.0
deployment_types:
- cli
- local
status: active
verified_at: '2026-09-06'
tags:
- infrastructure-as-code
- iac
- cloud
- devops
- providers
- state
- encryption
- automation
- open-source
- deep-dive
coverage:
  area: cloud-devops-sre
  topics:
  - infrastructure-as-code
  - deployment
  - platform-engineering
relationships:
- type: alternative-to
  target: cloud/terraform
  note: OpenTofu shares substantial Terraform language, provider, state, and workflow heritage but is independently governed, MPL-2.0 licensed, uses a separate registry, and can evolve features and compatibility boundaries independently.
- type: integrates-with
  target: cloud/kubernetes
  note: OpenTofu providers can provision Kubernetes clusters and manage Kubernetes API resources, while continuous in-cluster reconciliation is usually owned by Kubernetes controllers or GitOps systems.
