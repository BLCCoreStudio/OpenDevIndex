relationships:
- type: related-to
  target: opensource/linux-kernel
  note: Linux containers rely on kernel primitives such as namespaces, cgroups, capabilities, seccomp, and filesystem isolation.
- type: used-by
  target: tool/docker
  note: Docker builds, distributes, and runs application containers while adding developer tooling, image workflows, networking, storage, and lifecycle management.
- type: used-by
  target: tool/containerd
  note: containerd manages image and container lifecycle services and commonly drives OCI-compatible low-level runtimes.
- type: used-by
  target: tool/podman
  note: Podman exposes container and pod workflows while using OCI-compatible image and runtime conventions.
- type: used-by
  target: cloud/kubernetes
  note: Kubernetes schedules containerized workloads and delegates node-level image and runtime operations through the Container Runtime Interface.
