schema_version: 3
id: argocd
name: Argo CD
category: platform
kind: platform
domains:
- ci-cd
- cloud
- devops
summary: Declarative GitOps continuous-delivery platform for Kubernetes that renders desired application state from versioned sources, compares it with live clusters, and reconciles drift through controlled synchronization.
homepage: https://argo-cd.readthedocs.io/
repository: https://github.com/argoproj/argo-cd
license: Apache-2.0
deployment_types:
- self-hosted
status: active
verified_at: '2026-09-06'
tags:
- kubernetes
- gitops
- continuous-delivery
- reconciliation
- multi-cluster
- applicationset
- deep-dive
coverage:
  area: cloud-devops-sre
  topics:
  - orchestration
  - deployment
  - ci-cd
  - platform-engineering
relationships:
- type: integrates-with
  target: cloud/kubernetes
  note: Argo CD runs as Kubernetes controllers and services and reconciles generated desired resources against Kubernetes API state in one or more target clusters.
- type: uses
  target: tool/git
  note: Git repositories are a primary versioned source for application definitions, revisions, review history, and declarative promotion workflows.
- type: integrates-with
  target: cloud/helm
  note: Argo CD can consume and render Helm charts as a manifest-generation source while retaining Argo CD application reconciliation and release visibility.
- type: alternative-to
  target: platform/flux
  note: Argo CD and Flux are Kubernetes GitOps reconciliation platforms with different APIs, component models, workflows, and operational trade-offs.
