relationships:
- type: related-to
  target: concept/containers
  note: Kubernetes schedules and manages workloads built from the container process-isolation and OCI image/runtime model.
- type: integrates-with
  target: tool/containerd
  note: Kubelet communicates with CRI-compatible runtimes such as containerd to pull images and manage pod sandboxes and containers on nodes.
- type: compatible-with
  target: tool/docker
  note: Images built with Docker can be distributed through OCI-compatible registries and run in Kubernetes even though Kubernetes does not require Docker Engine on nodes.
