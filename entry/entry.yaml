- deep-dive
coverage:
  area: cloud-devops-sre
  topics:
  - containers
  - deployment
relationships:
- type: related-to
  target: concept/containers
  note: Docker packages and runs applications using operating-system container primitives and image-based distribution workflows.
- type: uses
  target: tool/containerd
  note: Docker Engine uses containerd for container lifecycle and, on current Engine installations, can also use containerd-backed image storage.
- type: alternative-to
  target: tool/podman
  note: Podman provides an alternative container workflow with strong OCI compatibility and a daemonless architecture.
- type: integrates-with
  target: cloud/kubernetes
  note: Docker-built OCI-compatible images are commonly deployed to Kubernetes even though Kubernetes no longer requires Docker Engine as a node runtime.
- type: related-to
  target: opensource/linux-kernel
  note: Linux containers rely on kernel primitives such as namespaces, cgroups, capabilities, and filesystem isolation rather than hardware virtualization.
