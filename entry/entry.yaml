schema_version: 3
id: prometheus
name: Prometheus
category: cloud
kind: platform
domains:
- observability
- cloud
- devops
summary: Open-source metrics monitoring and alerting platform built around labeled time series, pull-oriented scraping, PromQL, local TSDB storage, rule evaluation, and integrations for visualization and long-term or distributed storage.
homepage: https://prometheus.io/
repository: https://github.com/prometheus/prometheus
license: Apache-2.0
deployment_types:
- self-hosted
status: active
verified_at: '2026-09-06'
tags:
- monitoring
- metrics
- observability
- prometheus
- promql
- time-series
- alerting
- deep-dive
coverage:
  area: cloud-devops-sre
  topics:
  - observability
  - sre
  - reliability
relationships:
- type: integrates-with
  target: cloud/kubernetes
  note: Prometheus commonly discovers and scrapes Kubernetes workloads and infrastructure, while Kubernetes provides dynamic target metadata used by discovery and relabeling.
- type: integrates-with
  target: cloud/grafana
  note: Grafana commonly queries the Prometheus HTTP API as a data source for dashboards and exploratory visualization.
- type: integrates-with
  target: cloud/opentelemetry
  note: OpenTelemetry collectors and SDK pipelines can expose, receive, or translate metrics for Prometheus-compatible collection and remote-write architectures.
