schema_version: 3
id: terraform
name: Terraform
category: cloud
kind: tool
domains:
- cloud
- devops
summary: Infrastructure-as-code tool that evaluates declarative configuration into a dependency graph, coordinates provider plugins, compares configuration with prior state and remote objects, and applies planned lifecycle changes across cloud, SaaS, and infrastructure APIs.
homepage: https://developer.hashicorp.com/terraform
repository: https://github.com/hashicorp/terraform
license: BUSL-1.1
deployment_types:
- cli
- local
status: active
verified_at: '2026-09-06'
tags:
- infrastructure-as-code
- iac
- cloud
- devops
- providers
- state
- automation
- provisioning
- deep-dive
coverage:
  area: cloud-devops-sre
  topics:
  - infrastructure-as-code
  - deployment
  - platform-engineering
relationships:
- type: alternative-to
  target: tool/opentofu
  note: OpenTofu is a community-governed open-source Terraform-compatible infrastructure-as-code implementation that shares substantial workflow and configuration heritage while evolving independently.
- type: integrates-with
  target: cloud/kubernetes
  note: Terraform providers can provision Kubernetes clusters and manage Kubernetes API resources, though infrastructure provisioning and in-cluster reconciliation have different lifecycle and ownership models.
- type: related-to
  target: cloud/ansible
  note: Terraform is primarily declarative infrastructure lifecycle management, while Ansible is commonly used for configuration management and procedural orchestration; teams may combine them with explicit ownership boundaries.
