schema_version: 3
id: opentelemetry
name: OpenTelemetry
category: cloud
kind: standard
domains:
- observability
summary: Vendor-neutral observability framework and specification for instrumenting, generating, correlating, collecting, processing, and exporting traces, metrics, logs, and evolving telemetry signals through common APIs, SDKs, semantic conventions, context propagation, OTLP, and the OpenTelemetry Collector.
homepage: https://opentelemetry.io/
repository: https://github.com/open-telemetry/opentelemetry-specification
license: Apache-2.0
status: active
verified_at: '2026-09-06'
tags:
- observability
- tracing
- metrics
- logs
- otlp
- semantic-conventions
- context-propagation
- collector
- standards
- deep-dive
coverage:
  area: cloud-devops-sre
  topics:
  - observability
  - distributed-systems
  - standards
relationships:
- type: integrates-with
  target: cloud/prometheus
  note: OpenTelemetry metrics can interoperate with Prometheus through Prometheus-compatible instrumentation, scraping, exposition, remote-write, and Collector pipelines while retaining different metric data-model and transport semantics.
