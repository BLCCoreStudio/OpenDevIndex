schema_version: 3
id: docker
name: Docker
category: tool
kind: tool
domains:
- containers
- devops
summary: Container development platform and engine ecosystem for building OCI-compatible images, running isolated processes, managing networks and volumes, and packaging reproducible application environments.
homepage: https://www.docker.com/
repository: https://github.com/moby/moby
deployment_types:
- cli
- local
- self-hosted
- system
status: active
verified_at: '2026-09-06'
