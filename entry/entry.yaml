schema_version: 3
id: sqlite
name: SQLite
category: database
kind: database
domains:
- data
- embedded
summary: Embedded relational database engine that compiles SQL into bytecode and stores transactional B-tree state in ordinary files through a pager, journaling layer, and pluggable VFS without a separate database server.
homepage: https://www.sqlite.org/
repository: https://sqlite.org/src/
license: Public Domain
deployment_types:
- embedded
- library
- local
status: active
verified_at: '2026-09-06'
tags:
- sql
- relational
- database
- embedded
- local-storage
- b-tree
- pager
- wal
- transactions
- query-planner
- single-writer
- deep-dive
coverage:
  area: databases-data
  topics:
  - relational-databases
  - storage-engines
  - query-engines
relationships:
- type: alternative-to
  target: database/postgresql
  note: SQLite is an embedded single-file database library for local application-owned state, while PostgreSQL is a client/server database designed for shared networked workloads and higher concurrent write processing.
- type: alternative-to
  target: database/mysql
  note: SQLite embeds the SQL engine directly in an application and serializes writers per database file; MySQL uses a separate server with InnoDB, server-managed clients, replication, and HA tooling.
