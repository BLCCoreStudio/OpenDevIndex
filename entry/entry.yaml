  topics:
  - observability
  - sre
  - platform-engineering
relationships:
- type: integrates-with
  target: cloud/prometheus
  note: Grafana has a built-in Prometheus data source and commonly uses PromQL over the Prometheus HTTP API for metric dashboards, Explore workflows, exemplars, and alert queries.
