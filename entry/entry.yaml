schema_version: 3
id: github-actions
name: GitHub Actions
category: tool
kind: tool
domains:
- ci-cd
- devops
summary: GitHub-native workflow automation platform that turns repository events, reusable YAML workflows, permissions, runners, environments, actions, artifacts, caches, and identity tokens into CI/CD and repository automation jobs.
homepage: https://docs.github.com/actions
repository: https://github.com/actions/runner
license: MIT
deployment_types:
- saas
- self-hosted
status: active
verified_at: '2026-09-06'
tags:
- ci
- cd
- automation
- workflows
- runners
- deployments
- oidc
- supply-chain
- devops
- deep-dive
coverage:
  area: cloud-devops-sre
  topics:
  - ci-cd
  - deployment
  - platform-engineering
relationships:
- type: related-to
  target: tool/git
  note: GitHub Actions workflows are versioned with repositories and commonly react to Git history and collaboration events, while Git remains the underlying distributed version-control system.
- type: integrates-with
  target: cloud/kubernetes
  note: Actions can deploy Kubernetes workloads, and Actions Runner Controller is GitHub's recommended Kubernetes-based autoscaling solution for self-hosted runner scale sets.
