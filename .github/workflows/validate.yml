name: Validate OpenDevIndex Module

on:
  push:
    branches:
      - '**'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out module branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          path: module

      - name: Check out current validator from main
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: main
          path: validator

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: validator/requirements-ci.txt

      - name: Install current validator dependencies
        run: python -m pip install -r validator/requirements-ci.txt

      - name: Validate module against current main rules
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          PYTHONPATH="$GITHUB_WORKSPACE/validator/scripts" \
            python "$GITHUB_WORKSPACE/validator/scripts/validate_entry.py" \
            --branch "$BRANCH_NAME" \
            --root "$GITHUB_WORKSPACE/module"
