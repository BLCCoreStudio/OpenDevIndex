name: Validate OpenDevIndex

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install validator dependencies
        run: python -m pip install -r requirements-ci.txt

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Validate technology universe coverage
        run: |
          python scripts/validate_coverage.py \
            coverage/technology-universe-v1.yaml \
            --topic-allocation coverage/topic-allocation-v1.yaml

      - name: Validate curated catalogs
        run: |
          set -euo pipefail
          for catalog in catalog/*.yaml; do
            python scripts/validate_catalog.py "$catalog"
          done

      - name: Validate knowledge graph relationships
        run: python scripts/validate_relationships.py catalog/*.yaml

      - name: Validate module maturity manifest
        run: python scripts/module_maturity.py quality/module-maturity.yaml --catalog-dir catalog

      - name: Audit editorial quality
        run: |
          python scripts/audit_quality.py \
            --catalog-dir catalog \
            --minimum 80

      - name: Validate module
        env:
          MODULE_REF: ${{ github.head_ref || github.ref_name }}
        run: python scripts/validate_entry.py --branch "$MODULE_REF"

      - name: Smoke-test module generator without publishing
        if: github.event_name == 'pull_request' || github.ref_name == 'main'
        run: |
          python scripts/seed_modules.py \
            --catalog catalog/v0.1.yaml \
            --base-ref HEAD \
            --limit 1
          python scripts/seed_modules.py \
            --catalog catalog/v0.2-languages.yaml \
            --base-ref HEAD \
            --limit 1
          python scripts/seed_modules.py \
            --catalog catalog/v0.5-core-001a.yaml \
            --base-ref HEAD \
            --limit 1
          python scripts/seed_modules_v3.py \
            --catalog catalog/v0.5-architecture-001.yaml \
            --base-ref HEAD \
            --limit 1
