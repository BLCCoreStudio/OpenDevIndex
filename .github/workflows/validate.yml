name: Validate OpenDevIndex

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install validator dependencies
        run: python -m pip install -r requirements-ci.txt

      - name: Validate curated catalog
        run: python scripts/validate_catalog.py catalog/v0.1.yaml

      - name: Validate branch/module
        env:
          BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
        run: python scripts/validate_entry.py --branch "$BRANCH_NAME"

      - name: Smoke-test module generator without pushing
        if: github.event_name == 'pull_request' || github.ref_name == 'main'
        run: |
          python scripts/seed_modules.py \
            --catalog catalog/v0.1.yaml \
            --base-ref HEAD \
            --limit 1
