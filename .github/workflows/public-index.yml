name: Publish Public Index

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'catalog/**'
      - 'taxonomy/**'
      - 'scripts/build_index.py'
      - 'scripts/catalog_utils.py'
      - 'scripts/taxonomy.py'
      - 'scripts/validate_catalog.py'
      - '.github/workflows/public-index.yml'

permissions:
  contents: write

concurrency:
  group: opendevindex-public-index
  cancel-in-progress: false

jobs:
  publish-index:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-ci.txt

      - name: Generate public module index
        run: python scripts/build_index.py --catalog-dir catalog --output-dir dist/index --public-index INDEX.md

      - name: Publish only when the index changed
        run: |
          if [ -z "$(git status --porcelain -- INDEX.md)" ]; then
            echo 'INDEX.md is already current.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name "OpenDevIndex Publisher"
          git config user.email "207100624+BLCCoreStudio@users.noreply.github.com"
          git add INDEX.md
          git commit -m "docs: refresh public module index [skip ci]"
          git push origin HEAD:main
          echo 'Published updated INDEX.md.' >> "$GITHUB_STEP_SUMMARY"
