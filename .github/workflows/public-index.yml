name: Publish Public Index

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'catalog/**'
      - 'comparisons/**'
      - 'quality/module-maturity.yaml'
      - 'taxonomy/**'
      - 'scripts/build_comparisons.py'
      - 'scripts/build_index.py'
      - 'scripts/catalog_utils.py'
      - 'scripts/module_maturity.py'
      - 'scripts/taxonomy.py'
      - 'scripts/validate_catalog.py'
      - '.github/workflows/public-index.yml'

permissions:
  contents: write

concurrency:
  group: opendevindex-public-index
  cancel-in-progress: false

jobs:
  publish-index:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out main
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-ci.txt

      - name: Generate public module index
        run: python scripts/build_index.py --catalog-dir catalog --output-dir dist/index --public-index INDEX.md

      - name: Generate public comparison views
        run: |
          python scripts/build_comparisons.py \
            --comparisons-dir comparisons \
            --catalog-dir catalog \
            --output-dir dist/comparisons \
            --public-dir docs/comparisons

      - name: Publish only when discovery views changed
        run: |
          if [ -z "$(git status --porcelain -- INDEX.md docs/comparisons)" ]; then
            echo 'Public index and comparison views are already current.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name "OpenDevIndex Publisher"
          git config user.email "207100624+BLCCoreStudio@users.noreply.github.com"
          git add INDEX.md docs/comparisons
          git commit -m "docs: refresh public discovery views [skip ci]"
          git push origin HEAD:main
          echo 'Published updated INDEX.md and comparison views.' >> "$GITHUB_STEP_SUMMARY"
