name: Refresh Existing Modules

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'taxonomy/v2.yaml'
      - 'scripts/taxonomy.py'
      - 'scripts/seed_modules.py'
      - 'scripts/validate_entry.py'
      - '.github/workflows/refresh-v0.1.yml'

permissions:
  contents: write

concurrency:
  group: opendevindex-v0.1-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out main with full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: main

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install refresh dependencies
        run: python -m pip install -r requirements-ci.txt

      - name: Configure publication identity
        run: |
          git config user.name "OpenDevIndex Publisher"
          git config user.email "207100624+BLCCoreStudio@users.noreply.github.com"

      - name: Refresh validated v0.1 modules
        run: |
          python scripts/seed_modules.py \
            --catalog catalog/v0.1.yaml \
            --base-ref origin/main \
            --refresh-existing \
            --refresh-only \
            --push \
            --report refresh-v0.1-report.md

      - name: Publish refresh summary
        if: always()
        run: |
          if [ -f refresh-v0.1-report.md ]; then
            cat refresh-v0.1-report.md >> "$GITHUB_STEP_SUMMARY"
          fi
