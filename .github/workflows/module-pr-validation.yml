name: Validate Module Pull Request

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - '*/*'

# pull_request_target is deliberately constrained here. The workflow runs only
# trusted default-branch code, has a read-only token, does not use repository
# secrets, and never executes code from the pull-request head. Candidate module
# files are fetched as UTF-8 data through GitHub's Contents API and inspected by
# the trusted validator from main.
permissions:
  contents: read

jobs:
  validate-module-entry:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out trusted validator
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: main
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install trusted validator dependencies
        run: python -m pip install -r requirements-ci.txt

      - name: Materialize candidate entry as untrusted data
        id: candidate
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python scripts/fetch_pr_entry.py \
            --event "$GITHUB_EVENT_PATH" \
            --output "$RUNNER_TEMP/module-candidate" \
            --github-output "$GITHUB_OUTPUT"

      - name: Validate candidate against target module ref
        env:
          MODULE_REF: ${{ steps.candidate.outputs.module_ref }}
        run: |
          python scripts/validate_entry.py \
            --branch "$MODULE_REF" \
            --root "$RUNNER_TEMP/module-candidate"
