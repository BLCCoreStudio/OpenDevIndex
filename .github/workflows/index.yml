name: Build Search Index

on:
  pull_request:
    branches:
      - main
    paths:
      - 'catalog/**'
      - 'comparisons/**'
      - 'coverage/**'
      - 'quality/module-maturity.yaml'
      - 'taxonomy/**'
      - 'schema/**'
      - 'scripts/build_comparison_search.py'
      - 'scripts/build_comparisons.py'
      - 'scripts/build_index.py'
      - 'scripts/catalog_utils.py'
      - 'scripts/coverage_metadata.py'
      - 'scripts/coverage_progress.py'
      - 'scripts/module_maturity.py'
      - 'scripts/search_comparisons.py'
      - 'scripts/search_index.py'
      - 'scripts/taxonomy.py'
      - 'scripts/audit_quality.py'
      - 'scripts/url_safety.py'
      - 'scripts/validate_catalog.py'
      - 'tests/**'
      - '.github/workflows/index.yml'
  push:
    branches:
      - main
    paths:
      - 'catalog/**'
      - 'comparisons/**'
      - 'coverage/**'
      - 'quality/module-maturity.yaml'
      - 'taxonomy/**'
      - 'schema/**'
      - 'scripts/build_comparison_search.py'
      - 'scripts/build_comparisons.py'
      - 'scripts/build_index.py'
      - 'scripts/catalog_utils.py'
      - 'scripts/coverage_metadata.py'
      - 'scripts/coverage_progress.py'
      - 'scripts/module_maturity.py'
      - 'scripts/search_comparisons.py'
      - 'scripts/search_index.py'
      - 'scripts/taxonomy.py'
      - 'scripts/audit_quality.py'
      - 'scripts/url_safety.py'
      - 'scripts/validate_catalog.py'
      - 'tests/**'
      - '.github/workflows/index.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: opendevindex-search-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-search-index:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-ci.txt

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Build curated comparison artifacts
        run: |
          python scripts/build_comparisons.py \
            --comparisons-dir comparisons \
            --catalog-dir catalog \
            --output-dir dist/comparisons

      - name: Build curated comparison search artifact
        run: |
          python scripts/build_comparison_search.py \
            --input dist/comparisons/comparisons.json \
            --output dist/comparisons/search.json

      - name: Build deterministic catalog and search artifacts
        run: |
          python scripts/build_index.py \
            --catalog-dir catalog \
            --output-dir dist/index \
            --comparison-index dist/comparisons/module-comparisons.json

      - name: Build Technology Universe coverage progress
        run: |
          mkdir -p dist/coverage
          python scripts/coverage_progress.py \
            --catalog-dir catalog \
            --allocation coverage/topic-allocation-v1.yaml \
            --json-output dist/coverage/coverage.json \
            --markdown-output dist/coverage/coverage.md

      - name: Audit editorial quality
        run: python scripts/audit_quality.py --catalog-dir catalog --minimum 80

      - name: Smoke-test search facets
        run: |
          python scripts/search_index.py "machine learning" --index dist/index/search.json --kind framework --limit 5
          python scripts/search_index.py "api testing" --index dist/index/search.json --domain api --limit 5
          python scripts/search_index.py "web accessibility" --index dist/index/search.json --domain accessibility --limit 5
          python scripts/search_index.py "Terraform vs OpenTofu" --index dist/index/search.json --limit 5
          python scripts/search_index.py --comparison terraform-opentofu --index dist/index/search.json --json --limit 10 > /tmp/terraform-opentofu.json
          python scripts/search_index.py --has-comparison --index dist/index/search.json --json --limit 100 > /tmp/comparison-linked.json
          python scripts/search_comparisons.py "state encryption" --index dist/comparisons/search.json --json > /tmp/comparison-state-encryption.json
          python scripts/search_comparisons.py "wal checkpoints" --index dist/comparisons/search.json --json > /tmp/comparison-wal.json
          python scripts/search_comparisons.py --module database/sqlite --index dist/comparisons/search.json --json > /tmp/comparison-sqlite.json
          python scripts/search_comparisons.py "application instrumentation" --index dist/comparisons/search.json --json > /tmp/comparison-observability.json
          python scripts/search_comparisons.py --module cloud/grafana --index dist/comparisons/search.json --json > /tmp/comparison-grafana.json
          python - <<'PY'
          import json
          from pathlib import Path

          members = json.loads(Path('/tmp/terraform-opentofu.json').read_text(encoding='utf-8'))
          refs = {entry['ref'] for entry in members}
          assert refs == {'cloud/terraform', 'tool/opentofu'}, refs
          assert all(
              any(item['id'] == 'terraform-opentofu' for item in entry.get('comparisons', []))
              for entry in members
          )

          linked = json.loads(Path('/tmp/comparison-linked.json').read_text(encoding='utf-8'))
          assert len(linked) >= 8, len(linked)
          assert all(entry.get('comparison_count', 0) > 0 for entry in linked)

          state = json.loads(Path('/tmp/comparison-state-encryption.json').read_text(encoding='utf-8'))
          assert state and state[0]['id'] == 'terraform-opentofu', state

          wal = json.loads(Path('/tmp/comparison-wal.json').read_text(encoding='utf-8'))
          assert wal and wal[0]['id'] == 'relational-databases', wal

          sqlite = json.loads(Path('/tmp/comparison-sqlite.json').read_text(encoding='utf-8'))
          assert [entry['id'] for entry in sqlite] == ['relational-databases'], sqlite

          observability = json.loads(Path('/tmp/comparison-observability.json').read_text(encoding='utf-8'))
          assert observability and observability[0]['id'] == 'observability-roles', observability

          grafana = json.loads(Path('/tmp/comparison-grafana.json').read_text(encoding='utf-8'))
          assert [entry['id'] for entry in grafana] == ['observability-roles'], grafana
          PY

      - name: Publish build summary
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          data = json.loads(Path('dist/index/catalog.json').read_text(encoding='utf-8'))
          comparisons = json.loads(Path('dist/comparisons/comparisons.json').read_text(encoding='utf-8'))
          comparison_search = json.loads(Path('dist/comparisons/search.json').read_text(encoding='utf-8'))
          module_comparisons = json.loads(Path('dist/comparisons/module-comparisons.json').read_text(encoding='utf-8'))
          coverage = json.loads(Path('dist/coverage/coverage.json').read_text(encoding='utf-8'))
          print('# OpenDevIndex Search Index')
          print()
          print(f"Generated **{data['module_count']}** validated modules.")
          print(f"Generated **{comparisons['comparison_count']}** curated comparison view(s).")
          print(f"Searchable comparison records: **{comparison_search['comparison_count']}**.")
          print(f"Comparison-linked modules: **{module_comparisons['module_count']}**.")
          print(f"Coverage-mapped modules: **{coverage['mapped_modules']} / {coverage['target_modules']}**.")
          print()
          print('| Maturity | Modules |')
          print('| --- | ---: |')
          for level, count in data['maturity_counts'].items():
              print(f'| `{level}` | {count} |')
          print()
          print('| Kind | Modules |')
          print('| --- | ---: |')
          for kind, count in data['kind_counts'].items():
              print(f'| `{kind}` | {count} |')
          print()
          print(Path('dist/coverage/coverage.md').read_text(encoding='utf-8'))
          print()
          print(Path('dist/quality/quality-report.md').read_text(encoding='utf-8'))
          PY

      - name: Upload generated discovery artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: opendevindex-discovery-artifacts
          path: |
            dist/index
            dist/comparisons
            dist/coverage
            dist/quality
          if-no-files-found: error
          retention-days: 30
