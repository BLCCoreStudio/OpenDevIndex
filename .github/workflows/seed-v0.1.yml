name: Publish OpenDevIndex v0.1

on:
  workflow_dispatch:
    inputs:
      limit:
        description: Maximum number of missing modules to publish; 0 publishes all
        required: false
        default: '0'
  push:
    branches:
      - main
    paths:
      - 'catalog/v0.1.yaml'
      - 'scripts/seed_modules.py'
      - '.github/workflows/seed-v0.1.yml'

permissions:
  contents: write

concurrency:
  group: opendevindex-v0.1-publication
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out main with history
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          ref: main

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install publication dependencies
        run: python -m pip install -r requirements-ci.txt

      - name: Configure publication identity
        run: |
          git config user.name "OpenDevIndex Publisher"
          git config user.email "207100624+BLCCoreStudio@users.noreply.github.com"

      - name: Validate v0.1 catalog
        run: python scripts/validate_catalog.py catalog/v0.1.yaml

      - name: Publish validated knowledge modules
        env:
          INPUT_LIMIT: ${{ github.event.inputs.limit || '0' }}
        run: |
          python scripts/seed_modules.py \
            --catalog catalog/v0.1.yaml \
            --base-ref origin/main \
            --limit "$INPUT_LIMIT" \
            --push

      - name: Publish run summary
        if: always()
        run: |
          if [ -f seed-report.md ]; then
            cat seed-report.md >> "$GITHUB_STEP_SUMMARY"
          fi
