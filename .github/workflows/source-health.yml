name: Source Health

on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'catalog/**'
      - 'scripts/catalog_utils.py'
      - 'scripts/check_source_health.py'
      - 'scripts/url_safety.py'
      - 'scripts/validate_catalog.py'
      - '.github/workflows/source-health.yml'

permissions:
  contents: read

concurrency:
  group: opendevindex-source-health
  cancel-in-progress: false

jobs:
  check-sources:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-ci.txt

      - name: Check canonical sources
        run: |
          python scripts/check_source_health.py \
            --catalog-dir catalog \
            --timeout 8 \
            --retries 1 \
            --workers 12 \
            --report-json source-health.json \
            --report-md source-health.md \
            --fail-on broken

      - name: Publish health summary
        if: always()
        run: |
          if [ -f source-health.md ]; then
            cat source-health.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Source health report was not produced.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload health report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: opendevindex-source-health
          path: |
            source-health.json
            source-health.md
          if-no-files-found: warn
          retention-days: 30
