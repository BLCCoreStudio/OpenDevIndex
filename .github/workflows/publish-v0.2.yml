name: Publish OpenDevIndex v0.2

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'catalog/v0.2-*.yaml'
      - '.github/workflows/publish-v0.2.yml'

permissions:
  contents: write

concurrency:
  group: opendevindex-v0.2-publication
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out main with history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: main

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install publication dependencies
        run: python -m pip install -r requirements-ci.txt

      - name: Configure publication identity
        run: |
          git config user.name "OpenDevIndex Publisher"
          git config user.email "207100624+BLCCoreStudio@users.noreply.github.com"

      - name: Validate and publish v0.2 catalogs
        run: |
          set -euo pipefail
          : > publication-summary.md
          for catalog in catalog/v0.2-*.yaml; do
            python scripts/validate_catalog.py "$catalog"
            report="publication-$(basename "$catalog" .yaml).md"
            python scripts/seed_modules.py \
              --catalog "$catalog" \
              --base-ref origin/main \
              --push \
              --report "$report"
            cat "$report" >> publication-summary.md
            printf '\n' >> publication-summary.md
          done

      - name: Publish run summary
        if: always()
        run: |
          if [ -f publication-summary.md ]; then
            cat publication-summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
