  repository: https://github.com/sqlalchemy/sqlalchemy
  tags: [python, database, orm]
  sources:
  - {title: SQLAlchemy official site, url: https://www.sqlalchemy.org/, type: official}
  - {title: SQLAlchemy source repository, url: https://github.com/sqlalchemy/sqlalchemy, type: repository}
  use_cases: [Build database-backed Python applications, Compose SQL queries through a Python expression system, Map relational database tables to application objects with an ORM]
  key_points: [SQLAlchemy separates its Core SQL toolkit from higher-level ORM features, It supports many relational database dialects, Connection pooling and transaction handling are central parts of the library]
