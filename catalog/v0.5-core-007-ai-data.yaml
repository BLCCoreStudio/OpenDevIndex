- category: library
  id: onnxruntime
  name: ONNX Runtime
  summary: Cross-platform inference and training accelerator for models represented in ONNX, with execution providers targeting CPUs, GPUs, mobile devices, and specialized hardware.
  homepage: https://onnxruntime.ai/
  repository: https://github.com/microsoft/onnxruntime
  tags: [ai, inference, onnx]
  sources:
  - {title: ONNX Runtime official site, url: https://onnxruntime.ai/, type: official}
  - {title: ONNX Runtime source repository, url: https://github.com/microsoft/onnxruntime, type: repository}
  use_cases: [Run ONNX models across heterogeneous hardware, Optimize production inference pipelines, Embed machine-learning inference in server desktop and mobile applications]
  key_points: [ONNX Runtime uses pluggable execution providers for hardware backends, Graph optimizations are applied before and during execution, The runtime decouples model format from vendor-specific inference engines]
  kind: runtime
  domains: [ai, machine-learning, systems]
  deployment_types: [library, local, mobile]
