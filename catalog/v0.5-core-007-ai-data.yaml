- category: library
  id: matplotlib
  name: Matplotlib
  summary: Python plotting library for creating static, animated, and interactive visualizations with fine-grained control over figures, axes, styles, and output formats.
  homepage: https://matplotlib.org/
  repository: https://github.com/matplotlib/matplotlib
  tags: [python, visualization, data]
  sources:
  - {title: Matplotlib official site, url: https://matplotlib.org/, type: official}
  - {title: Matplotlib source repository, url: https://github.com/matplotlib/matplotlib, type: repository}
  use_cases: [Create publication-quality scientific plots, Visualize data in notebooks and Python applications, Export charts to common raster and vector formats]
  key_points: [Matplotlib Figure and Axes model provides detailed plotting control, The library supports many backends for notebooks GUIs and files, A large part of the Python visualization ecosystem interoperates with Matplotlib]
  kind: library
  domains: [data, analytics, python]
  deployment_types: [library, local]
- category: library
  id: polars
  name: Polars
  summary: High-performance DataFrame library written in Rust with Python and other language bindings, built around columnar execution, query optimization, and Apache Arrow concepts.
  homepage: https://pola.rs/
  repository: https://github.com/pola-rs/polars
  tags: [dataframe, rust, analytics]
  sources:
  - {title: Polars official site, url: https://pola.rs/, type: official}
  - {title: Polars source repository, url: https://github.com/pola-rs/polars, type: repository}
  use_cases: [Transform large tabular datasets efficiently, Build lazy query pipelines with optimizer support, Use DataFrame workflows from Python or native Rust]
  key_points: [Polars uses a columnar execution model, Lazy queries allow optimization before execution, The core engine is implemented in Rust]
  kind: library
  domains: [data, analytics]
  deployment_types: [library, local]
