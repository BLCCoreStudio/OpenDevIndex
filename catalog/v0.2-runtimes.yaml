  id: wasmtime
  name: Wasmtime
  summary: Standalone WebAssembly runtime from the Bytecode Alliance focused on standards compliance, security, embedding, and efficient execution across platforms.
  homepage: https://wasmtime.dev/
  repository: https://github.com/bytecodealliance/wasmtime
  tags: [webassembly, runtime, systems]
  sources:
