- category: platform
  id: gitlab
  name: GitLab
  homepage: https://about.gitlab.com/
  repository: https://gitlab.com/gitlab-org/gitlab
  tags:
  - git
  - devops
  - ci
  kind: platform
  domains:
  - developer-tools
  - ci-cd
  - devops
  deployment_types:
  - self-hosted
  summary: GitLab is a software development platform combining Git repository hosting, code review, issue tracking, CI/CD, security, and delivery workflows in a single integrated application.
  sources:
  - title: GitLab official site or documentation
    url: https://about.gitlab.com/
    type: official
  - title: GitLab source repository
    url: https://gitlab.com/gitlab-org/gitlab
    type: repository
  use_cases:
  - Deploy GitLab as a shared platform for teams working across developer tools and related engineering workflows
  - Centralize capabilities that would otherwise require several separately managed services, integrations, or operational processes
  - Evaluate GitLab for self-hosted or managed adoption based on governance, scalability, security, and integration requirements
  key_points:
  - GitLab is a software development platform combining Git repository hosting, code review, issue tracking, CI/CD, security, and delivery workflows in a single integrated application.
  - Platform value depends on how well its integrated services match an organization's workflow, governance, and operations model
  - Deployment architecture, supported integrations, licensing, and upgrade requirements should be checked in current documentation
