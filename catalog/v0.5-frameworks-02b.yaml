    url: https://rocket.rs/
    type: official
  - title: Rocket source repository
    url: https://github.com/rwf2/Rocket
    type: repository
  use_cases:
  - Build applications with Rocket using its framework conventions, reusable components, and supported runtime ecosystem
  - Standardize project structure and common implementation patterns around Rocket's documented APIs and tooling
  - Evaluate Rocket against alternative frameworks for architecture, deployment targets, performance, and ecosystem fit
  key_points:
