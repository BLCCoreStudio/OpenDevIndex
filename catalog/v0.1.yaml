entries:
- category: tool
  id: git
  name: Git
  summary: Distributed version control system used to track source history, collaborate through branches, and exchange changes across software projects.
  homepage: https://git-scm.com/
  repository: https://github.com/git/git
  tags:
  - version-control
  - scm
  - cli
  sources:
  - title: Git official site
    url: https://git-scm.com/
    type: official
  - title: Git source repository
    url: https://github.com/git/git
    type: repository
  use_cases:
  - Track and review source-code history
  - Coordinate parallel development with branches
  - Exchange changes through distributed repositories
  key_points:
  - Distributed rather than server-dependent
  - Content-addressed object model underpins commits and trees
- category: tool
  id: qemu
  name: QEMU
  summary: Open-source machine emulator and virtualizer that can emulate full systems or individual processes across many CPU architectures.
  homepage: https://www.qemu.org/
  repository: https://gitlab.com/qemu-project/qemu
  tags:
  - virtualization
  - emulation
  - systems
  sources:
  - title: QEMU project
    url: https://www.qemu.org/
    type: official
  - title: QEMU documentation
    url: https://www.qemu.org/docs/master/
    type: documentation
  use_cases:
  - Run guest operating systems
  - Emulate foreign CPU architectures
  - Build virtualization and device-testing workflows
  key_points:
  - Supports full-system and user-mode emulation
  - Can use hardware acceleration when available
- category: tool
  id: docker
  name: Docker
  summary: Container development platform centered on portable images and isolated application processes, widely used for packaging and deployment workflows.
  homepage: https://www.docker.com/
  repository: https://github.com/docker/cli
  tags:
  - containers
  - devops
  - packaging
  sources:
  - title: Docker documentation
    url: https://docs.docker.com/
    type: documentation
  - title: Docker CLI repository
    url: https://github.com/docker/cli
    type: repository
  use_cases:
  - Package applications into container images
  - Create reproducible local development environments
  - Run multi-service application stacks
  key_points:
  - Images are layered and content-addressed
  - Dockerfiles describe image build steps
- category: tool
  id: podman
  name: Podman
  summary: Daemonless container engine for building, running, and managing OCI containers and pods with strong support for rootless operation.
  homepage: https://podman.io/
  repository: https://github.com/containers/podman
  tags:
  - containers
  - oci
  - rootless
  sources:
  - title: Podman official site
    url: https://podman.io/
    type: official
  - title: Podman repository
    url: https://github.com/containers/podman
    type: repository
  use_cases:
  - Run rootless containers
  - Manage pods and OCI images
  - Use Docker-compatible container workflows
  key_points:
  - Does not require a central daemon
  - Integrates closely with Linux container primitives
- category: tool
  id: neovim
  name: Neovim
  summary: Extensible text editor derived from Vim with a modernized architecture, Lua configuration, asynchronous APIs, and a large plugin ecosystem.
  homepage: https://neovim.io/
  repository: https://github.com/neovim/neovim
  tags:
  - editor
  - lua
  - terminal
  sources:
  - title: Neovim official site
    url: https://neovim.io/
    type: official
  - title: Neovim repository
    url: https://github.com/neovim/neovim
    type: repository
  use_cases:
  - Edit code efficiently from terminal or GUI clients
  - Build programmable editor workflows in Lua
  - Integrate language servers and developer tooling
  key_points:
  - Provides built-in LSP client capabilities
  - Maintains broad Vim editing-model compatibility
- category: tool
  id: vscode
  name: Visual Studio Code
  summary: Open-source-based code editor from Microsoft with extension support, integrated debugging, language tooling, terminals, and remote development features.
  homepage: https://code.visualstudio.com/
  repository: https://github.com/microsoft/vscode
  tags:
  - editor
  - ide
  - extensions
  sources:
  - title: VS Code documentation
    url: https://code.visualstudio.com/docs
    type: documentation
  - title: VS Code repository
    url: https://github.com/microsoft/vscode
    type: repository
  use_cases:
  - Develop across many programming languages
  - Debug applications and inspect source
  - Extend workflows with marketplace extensions
  key_points:
  - Built on Electron
  - Uses an extension-host architecture to isolate many extensions
- category: tool
  id: tmux
  name: tmux
  summary: Terminal multiplexer that creates persistent shell sessions and supports multiple windows and panes inside a single terminal connection.
  homepage: https://github.com/tmux/tmux
  repository: https://github.com/tmux/tmux
  tags:
  - terminal
  - shell
  - productivity
  sources:
  - title: tmux repository
    url: https://github.com/tmux/tmux
    type: repository
  - title: tmux manual
    url: https://man.openbsd.org/tmux
    type: documentation
  use_cases:
  - Keep terminal sessions alive across disconnects
  - Split one terminal into panes and windows
  - Manage remote command-line workflows
  key_points:
  - Client-server architecture preserves sessions
  - Configuration and key bindings are highly customizable
- category: tool
  id: curl
  name: curl
  summary: Command-line tool and transfer library for moving data using URLs across many network protocols, commonly used for HTTP automation and debugging.
  homepage: https://curl.se/
  repository: https://github.com/curl/curl
  tags:
  - networking
  - http
  - cli
  sources:
  - title: curl official site
    url: https://curl.se/
    type: official
  - title: curl repository
    url: https://github.com/curl/curl
    type: repository
  use_cases:
  - Call and inspect web APIs
  - Download or upload network resources
  - Debug HTTP and TLS behavior
  key_points:
  - libcurl provides the transfer engine as a library
  - Supports a broad set of URL-based protocols
- category: tool
  id: jq
  name: jq
  summary: Lightweight command-line processor for selecting, transforming, filtering, and composing JSON data in shell scripts and data pipelines.
  homepage: https://jqlang.org/
  repository: https://github.com/jqlang/jq
  tags:
  - json
  - cli
  - data
  sources:
  - title: jq official site
    url: https://jqlang.org/
    type: official
  - title: jq repository
    url: https://github.com/jqlang/jq
    type: repository
  use_cases:
  - Filter JSON returned by APIs
  - Transform structured data in shell pipelines
  - Extract fields for automation scripts
  key_points:
  - Uses its own compact query language
  - Designed to compose naturally with Unix pipelines
- category: tool
  id: ripgrep
  name: ripgrep
  summary: Fast recursive text-search command-line tool that respects common ignore files and is optimized for searching source trees and large directories.
  homepage: https://github.com/BurntSushi/ripgrep
  repository: https://github.com/BurntSushi/ripgrep
  tags:
  - search
  - cli
  - rust
  sources:
  - title: ripgrep repository
    url: https://github.com/BurntSushi/ripgrep
    type: repository
  use_cases:
  - Search source repositories quickly
  - Find regular-expression matches recursively
  - Respect .gitignore during code searches
  key_points:
  - Written in Rust
  - Combines recursive traversal with regex searching
- category: tool
  id: fd
  name: fd
  summary: Simple and fast alternative to the traditional Unix find command, optimized for ergonomic filename and path searches from the command line.
  homepage: https://github.com/sharkdp/fd
  repository: https://github.com/sharkdp/fd
  tags:
  - search
  - filesystem
  - rust
  sources:
  - title: fd repository
    url: https://github.com/sharkdp/fd
    type: repository
  use_cases:
  - Locate files by name patterns
  - Search directory trees with readable defaults
  - Feed file selections into shell workflows
  key_points:
  - Uses regular expressions by default
  - Ignores hidden and ignored files unless requested
- category: tool
  id: cmake
  name: CMake
  summary: Cross-platform build-system generator used to describe native software builds independently of a specific compiler, IDE, or underlying build tool.
  homepage: https://cmake.org/
  repository: https://github.com/Kitware/CMake
  tags:
  - build-system
  - cpp
  - cross-platform
  sources:
  - title: CMake official site
    url: https://cmake.org/
    type: official
  - title: CMake documentation
    url: https://cmake.org/cmake/help/latest/
    type: documentation
  use_cases:
  - Configure portable C and C++ builds
  - Generate Ninja, Makefile, or IDE project files
  - Discover dependencies during native builds
  key_points:
  - CMake generates build-system files rather than compiling directly
  - CMakeLists.txt is the primary project description format
- category: tool
  id: meson
  name: Meson
  summary: High-productivity build system focused on fast, reliable native builds with concise project definitions and first-class Ninja integration.
  homepage: https://mesonbuild.com/
  repository: https://github.com/mesonbuild/meson
  tags:
  - build-system
  - ninja
  - native
  sources:
  - title: Meson official site
    url: https://mesonbuild.com/
    type: official
  - title: Meson repository
    url: https://github.com/mesonbuild/meson
    type: repository
  use_cases:
  - Configure native software projects
  - Drive fast incremental builds through Ninja
  - Define cross-compilation environments
  key_points:
  - Uses meson.build project files
  - Emphasizes out-of-tree builds and reproducibility
- category: tool
  id: bazel
  name: Bazel
  summary: Build and test system designed for large multi-language codebases with explicit dependencies, caching, and reproducible build graphs.
  homepage: https://bazel.build/
  repository: https://github.com/bazelbuild/bazel
  tags:
  - build-system
  - monorepo
  - hermetic
  sources:
  - title: Bazel official site
    url: https://bazel.build/
    type: official
  - title: Bazel repository
    url: https://github.com/bazelbuild/bazel
    type: repository
  use_cases:
  - Build large multi-language repositories
  - Reuse cached build outputs
  - Define hermetic build and test targets
  key_points:
  - Targets and dependencies form an explicit build graph
  - Remote execution and caching are core scaling features
- category: tool
  id: make
  name: GNU Make
  summary: Classic build automation tool that evaluates dependency rules and shell recipes to update files and targets when their inputs change.
  homepage: https://www.gnu.org/software/make/
  tags:
  - build-system
  - gnu
  - automation
  sources:
  - title: GNU Make project
    url: https://www.gnu.org/software/make/
    type: official
  - title: GNU Make manual
    url: https://www.gnu.org/software/make/manual/
    type: documentation
  use_cases:
  - Compile software from dependency rules
  - Automate repeatable command sequences
  - Express incremental file-based workflows
  key_points:
  - Makefiles describe targets, prerequisites, and recipes
  - Timestamp-based dependency evaluation drives many builds
- category: tool
  id: just
  name: just
  summary: Command runner for project-specific recipes, offering a focused alternative to using Makefiles for development commands that are not build graphs.
  homepage: https://just.systems/
  repository: https://github.com/casey/just
  tags:
  - command-runner
  - automation
  - developer-tools
  sources:
  - title: just documentation
    url: https://just.systems/
    type: documentation
  - title: just repository
    url: https://github.com/casey/just
    type: repository
  use_cases:
  - Document common development commands
  - Create cross-project task recipes
  - Replace ad-hoc shell snippets with named tasks
  key_points:
  - Uses a justfile to define recipes
  - Focuses on command running rather than dependency-aware builds
- category: tool
  id: nix
  name: Nix
  summary: Functional package manager and build system focused on reproducible environments, isolated package stores, and declarative software composition.
  homepage: https://nixos.org/
  repository: https://github.com/NixOS/nix
  tags:
  - package-manager
  - reproducibility
  - linux
  sources:
  - title: Nix project
    url: https://nixos.org/
    type: official
  - title: Nix manual
    url: https://nix.dev/manual/nix/latest/
    type: documentation
  use_cases:
  - Create reproducible development environments
  - Build packages in isolated stores
  - Manage declarative system and software configurations
  key_points:
  - Package paths include hashes derived from build inputs
  - Multiple package versions can coexist without path collisions
- category: tool
  id: homebrew
