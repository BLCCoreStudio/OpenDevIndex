schema_version: 1
default_level: overview
levels:
  - overview
  - guide
  - deep-dive
modules:
  tool/git:
    level: deep-dive
    reviewed_at: '2026-09-01'
    note: First flagship deep-dive module and reference quality bar for future module upgrades.
  tool/docker:
    level: deep-dive
    reviewed_at: '2026-09-05'
    note: Second flagship deep-dive; covers container architecture, OCI/runtime boundaries, build, storage, networking, security, reliability, and operational trade-offs.
  concept/containers:
    level: deep-dive
    reviewed_at: '2026-09-05'
    note: Foundational deep-dive on Linux process isolation, cgroups, OCI image/runtime/distribution boundaries, storage, networking, security, performance, and failure modes.
  tool/containerd:
    level: deep-dive
    reviewed_at: '2026-09-05'
    note: Runtime-layer deep-dive on content, images, snapshotters, tasks, shims, plugins, CRI, node operations, security, performance, reliability, and upgrades.
  cloud/kubernetes:
    level: deep-dive
    reviewed_at: '2026-09-05'
    note: Orchestration deep-dive on API-driven reconciliation, control-plane architecture, scheduling, kubelet/CRI boundaries, networking, storage, security, extensibility, reliability, and cluster operations.
  cloud/helm:
    level: deep-dive
    reviewed_at: '2026-09-06'
    note: Kubernetes packaging and release-management deep-dive on charts, values, rendering, releases, upgrades, hooks, CRDs, OCI distribution, security, supply chain, GitOps boundaries, and failure diagnosis.
  platform/argocd:
    level: deep-dive
    reviewed_at: '2026-09-06'
    note: GitOps delivery-control-plane deep-dive on source resolution, manifest generation, desired/live comparison, health, synchronization, ApplicationSets, multi-cluster policy, security, recovery, and operational failure diagnosis.
  cloud/prometheus:
    level: deep-dive
    reviewed_at: '2026-09-06'
    note: Metrics observability deep-dive on scraping, discovery, relabeling, PromQL, TSDB/WAL storage, rules, alerting, cardinality, federation, remote write, HA, scaling, and failure diagnosis.
  cloud/grafana:
    level: deep-dive
    reviewed_at: '2026-09-06'
    note: Observability interaction-layer deep-dive on data sources, dashboards, Explore, transformations, alerting, provisioning, permissions, plugin security, HA, query cost, and failure diagnosis.
  cloud/opentelemetry:
    level: deep-dive
    reviewed_at: '2026-09-06'
    note: Observability interoperability deep-dive on APIs/SDKs, Resources, semantic conventions, propagation, traces, metrics, logs, OTLP, Collector pipelines, sampling, durability, privacy, and backend integration.
  cloud/terraform:
    level: deep-dive
    reviewed_at: '2026-09-06'
    note: Infrastructure-as-code deep-dive on provider plugins, dependency graphs, resource identity, state and locking, plan/apply semantics, modules, refactoring, imports, supply-chain security, CI/CD, recovery, and OpenTofu trade-offs.
  tool/opentofu:
    level: deep-dive
    reviewed_at: '2026-09-06'
    note: Open-source IaC deep-dive on provider compatibility, state and locking, native state/plan encryption, registry security, Terraform migration, compatibility promises, recovery, and portability.
  cloud/ansible:
    level: deep-dive
    reviewed_at: '2026-09-06'
    note: Automation deep-dive on inventory, variables, play execution, plugins, Collections, idempotency, concurrency, Vault, supply-chain security, rolling changes, debugging, and failure handling.
  tool/github-actions:
    level: deep-dive
    reviewed_at: '2026-09-06'
    note: CI/CD deep-dive on workflow/event semantics, permissions, OIDC, environments, action/reusable-workflow supply chain, hosted/self-hosted runners, cache/artifact trust, concurrency, and deployment security.
  database/postgresql:
    level: deep-dive
    reviewed_at: '2026-09-06'
    note: Relational database deep-dive on MVCC, WAL, vacuum, planner statistics, indexes, locks, replication, PITR, HA boundaries, security, migrations, observability, and failure diagnosis.
  database/mysql:
    level: deep-dive
    reviewed_at: '2026-09-06'
    note: MySQL deep-dive on SQL/storage-engine boundaries, InnoDB indexes and buffer pool, redo/undo, MVCC and locking, optimizer statistics, binlog replication, GTIDs, Group Replication, PITR, security, HA, and failure diagnosis.
  database/sqlite:
    level: deep-dive
    reviewed_at: '2026-09-06'
    note: SQLite deep-dive on VDBE execution, B-tree/pager/VFS architecture, rowid storage, rollback journals and WAL, single-writer concurrency, checkpoints, query planning, backup, filesystem safety, security, and corruption diagnosis.
