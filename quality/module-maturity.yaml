schema_version: 1
default_level: overview
levels:
  - overview
  - guide
  - deep-dive
modules:
  tool/git:
    level: deep-dive
    reviewed_at: '2026-09-01'
    note: First flagship deep-dive module and reference quality bar for future module upgrades.
  tool/docker:
    level: deep-dive
    reviewed_at: '2026-09-05'
    note: Second flagship deep-dive; covers container architecture, OCI/runtime boundaries, build, storage, networking, security, reliability, and operational trade-offs.
  concept/containers:
    level: deep-dive
    reviewed_at: '2026-09-05'
    note: Foundational deep-dive on Linux process isolation, cgroups, OCI image/runtime/distribution boundaries, storage, networking, security, performance, and failure modes.
  tool/containerd:
    level: deep-dive
    reviewed_at: '2026-09-05'
    note: Runtime-layer deep-dive on content, images, snapshotters, tasks, shims, plugins, CRI, node operations, security, performance, reliability, and upgrades.
  cloud/kubernetes:
    level: deep-dive
    reviewed_at: '2026-09-05'
    note: Orchestration deep-dive on API-driven reconciliation, control-plane architecture, scheduling, kubelet/CRI boundaries, networking, storage, security, extensibility, reliability, and cluster operations.
  cloud/helm:
    level: deep-dive
    reviewed_at: '2026-09-06'
    note: Kubernetes packaging and release-management deep-dive on charts, values, rendering, releases, upgrades, hooks, CRDs, OCI distribution, security, supply chain, GitOps boundaries, and failure diagnosis.
  platform/argocd:
    level: deep-dive
    reviewed_at: '2026-09-06'
    note: GitOps delivery-control-plane deep-dive on source resolution, manifest generation, desired/live comparison, health, synchronization, ApplicationSets, multi-cluster policy, security, recovery, and operational failure diagnosis.
  cloud/prometheus:
    level: deep-dive
    reviewed_at: '2026-09-06'
    note: Metrics observability deep-dive on scraping, discovery, relabeling, PromQL, TSDB/WAL storage, rules, alerting, cardinality, federation, remote write, HA, scaling, and failure diagnosis.
